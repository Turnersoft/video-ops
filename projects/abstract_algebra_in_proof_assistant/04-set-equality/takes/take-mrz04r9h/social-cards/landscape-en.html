<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200, height=630" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(1200px 800px at 10% 0%, rgba(56, 189, 248, 0.22), transparent 55%),
        radial-gradient(900px 700px at 100% 100%, rgba(167, 139, 250, 0.18), transparent 50%),
        linear-gradient(145deg, #0b1220 0%, #111827 38%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      padding: 56px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }
    .badge {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 999px;
      padding: 10px 18px;
      white-space: nowrap;
    }
    .series {
      font-size: 20px;
      color: #94a3b8;
      text-align: right;
      line-height: 1.3;
      max-width: 42%;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      min-height: 0;
    }
    h1 {
      font-size: 46px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
      max-height: 265px;
      overflow: hidden;
    }
    .hook {
      font-size: 28px;
      line-height: 1.45;
      color: #cbd5e1;
      max-width: 95%;
      text-wrap: pretty;
      max-height: 176px;
      overflow: hidden;
    }
    .footer {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-top: 24px;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
    }
    .cta {
      font-size: 22px;
      font-weight: 600;
      color: #e2e8f0;
      max-width: 70%;
      line-height: 1.35;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
    }
    .accent {
      width: 72px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="badge">Episode 4</div>
    <div class="series">04_set_equality</div>
  </div>
  <div class="main">
    <div class="accent"></div>
    <h1>4. Set equality: what the equal sign means in a proof assistant</h1>
    <p class="hook">Think = is obvious?</p>
  </div>
  <div class="footer">
    <div class="cta">Read the card · no video required</div>
    <div class="brand">Turn-Lang</div>
  </div>
</body>
</html>
